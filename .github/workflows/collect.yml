name: Traffic — collect clone stats

# Daily: snapshot each tracked repo's 14-day clone traffic, accumulate an
# all-time per-repo tally in data/, and publish one Shields endpoint badge per
# repo to GitHub Pages. Product repos are never touched — only this repo's data/
# is committed, and the badges are served from Pages (no gh-pages branch).

on:
  schedule:
    - cron: '17 3 * * *'   # daily at 03:17 UTC (14-day API window; daily is safe)
  workflow_dispatch:        # manual run — use for the first run / to backfill a gap

# contents: commit the accumulated data/ back to this repo.
# pages + id-token: deploy the badges to GitHub Pages (artifact deploy).
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: traffic-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Collect clone stats
        env:
          # A PAT is REQUIRED: the traffic API needs Administration:Read on each
          # tracked repo, which the built-in GITHUB_TOKEN only has for THIS repo.
          # Add an Actions secret named TRAFFIC_TOKEN (see README.md).
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: bash scripts/collect.sh

      - name: Commit accumulated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "chore(traffic): update clone stats [skip ci]"
            git push
          fi

      # Publish public/ to Pages via artifact — no gh-pages branch, no extra commit.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
